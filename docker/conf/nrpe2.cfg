# NRPE 2.15 - cible de test "vieil agent". Protocole v2 uniquement.
# SSL = ADH impose, DH 512 statique (get_dh512 compile en dur). Pas de
# directives ssl_version / ssl_cipher_list / nasty_metachars en 2.x.

log_facility=daemon
debug=1
pid_file=/run/nrpe2.pid
server_port=5666
nrpe_user=nagios
nrpe_group=nagios

allowed_hosts=127.0.0.1,::1,172.16.0.0/12

# Compile avec --enable-command-args : dont_blame_nrpe=1 prend alors effet et
# autorise les arguments client ($ARG1$).
dont_blame_nrpe=1

command_timeout=60
connection_timeout=300

command[check_users]=/usr/lib/nagios/plugins/check_users -w 5 -c 10
command[check_load]=/usr/lib/nagios/plugins/check_load -w 15,10,5 -c 30,25,20
command[check_root]=/usr/lib/nagios/plugins/check_disk -w 20% -c 10% -p /
command[check_total_procs]=/usr/lib/nagios/plugins/check_procs -w 150 -c 200
command[check_ping]=/usr/lib/nagios/plugins/check_ping -H $ARG1$ -w 100.0,20% -c 500.0,60% -p 5
