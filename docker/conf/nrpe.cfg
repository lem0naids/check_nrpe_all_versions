# NRPE 4.1.3 - config lab, lie a OpenSSL 1.0.2 (Ubuntu 16.04)

# Lecture : docker compose exec nrpe-server tail -f /usr/local/nagios/var/nrpe.log
log_file=/usr/local/nagios/var/nrpe.log
debug=1
pid_file=/run/nrpe.pid
server_port=5666
nrpe_user=nagios
nrpe_group=nagios

# Les deux conteneurs sont sur le reseau compose : on ouvre le /16 par defaut.
# A restreindre si tu changes le subnet.
allowed_hosts=127.0.0.1,::1,172.16.0.0/12

# dont_blame_nrpe n'a AUCUN effet si NRPE n'est pas compile avec
# --enable-command-args : le demon repond "Request contained command arguments!"
# quel que soit ce reglage. L'image par defaut est compilee ENABLE_ARGS=1
# (cf. docker-compose.yml), donc ce reglage est actif. A laisser a 0 hors lab.
dont_blame_nrpe=1
allow_bash_command_substitution=0

# nasty_metachars : liste des caracteres interdits dans TOUTE requete (nom de
# commande comme arguments). Le defaut compile est  |`&><'\[]{};\r\n .
# On NE PEUT PAS la vider : le parseur rejette une valeur absente (strtok sur
# "\n" renvoie NULL) et le demon quitte en erreur. On y met donc un seul
# caractere de controle qui n'apparait jamais dans une requete texte (\a, la
# sonnette) : tout le reste ( ; | & > < etc.) passe alors librement.
# Lab uniquement : laisse passer des metacaracteres shell dans les requetes.
nasty_metachars=\a

command_timeout=60
connection_timeout=300

# --- SSL : parametres compatibles branche 1.0 ---
# SSLv2+ = "n'importe quelle version, on negocie la meilleure".
ssl_version=SSLv2+
# ADH (Diffie-Hellman anonyme, sans certificat) : le defaut historique de NRPE.
ssl_use_adh=1
# Pas de @SECLEVEL ici : la directive n'existe qu'a partir d'OpenSSL 1.1.0.
ssl_cipher_list=ALL:!MD5:@STRENGTH
# 0x2f = erreurs SSL + version + cipher negocie, utile pour verifier la compat.
ssl_logging=0x2f

# --- Commandes ---
command[check_users]=/usr/lib/nagios/plugins/check_users -w 5 -c 10
command[check_load]=/usr/lib/nagios/plugins/check_load -r -w .15,.10,.05 -c .30,.25,.20
command[check_root]=/usr/lib/nagios/plugins/check_disk -w 20% -c 10% -p /
command[check_zombie_procs]=/usr/lib/nagios/plugins/check_procs -w 5 -c 10 -s Z
command[check_total_procs]=/usr/lib/nagios/plugins/check_procs -w 150 -c 200
# L'hote a pinguer est fourni par le client ($ARG1$) : necessite dont_blame_nrpe=1
# et un demon compile ENABLE_ARGS=1 (cas de l'image par defaut).
# Appel : check_nrpe -H <serveur> -c check_ping -a <hote>
command[check_ping]=/usr/lib/nagios/plugins/check_ping -H $ARG1$ -w 100.0,20% -c 500.0,60% -p 5
